# Ugoos SK1 chip S928X-K Octa core 8G RAM 128G eMMC
BOARD_NAME="Ugoos SK1"
BOARDFAMILY="meson-g12a"  # chip families  S928X-K
BOARD_MAINTAINER="Nguyen Tat Hung"
KERNEL_TARGET="current,edge"
FULL_DESKTOP="no"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="amlogic/s5_s928x_ugoos_sk1_8g.dtb"
BOOTCONFIG="ugoos-sk1_defconfig"  # Cần tạo file này


# Mainline U-Boot
function post_family_config__ugoos_sk1_use_mainline_uboot() {
        display_alert "$BOARD" "Using mainline U-Boot for $BOARD / $BRANCH" "info"

        declare -g BOOTDELAY=1                                       # Wait for UART interrupt to enter UMS/RockUSB mode etc
        declare -g BOOTSOURCE="https://github.com/khoahung/u-boot.git" # We  ^}   ^o Mainline U-Boot
        declare -g BOOTBRANCH="tag:khoahung_dev"
        declare -g BOOTPATCHDIR="khoahung_dev"
        declare -g BOOTDIR="u-boot-${BOARD}" # do not share u-boot directory
        declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin"
        unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd # disable stuff from rockchip64_common; we're using binman here which do>

        # Just use the binman-provided u-boot-rockchip.bin, which is ready-to-go
        function write_uboot_platform() {
                dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
        }
}
